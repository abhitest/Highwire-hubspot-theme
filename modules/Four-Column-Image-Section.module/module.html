<section class="hw-four-images baseModuleStyle {{ name|escape_attr }} {{ module.custom_style.custom_class|escape_attr }}"{% if module.custom_style.section_id %} id="{{ module.custom_style.section_id|escape_attr }}"{% endif %}>
  <div class="baseModuleParent content-wrapper">
    <div class="hw-four-images__grid">
      {% for item in module.content_group.images %}
      <div class="hw-four-images__item">
        {% if item.image.src %}<img src="{{ item.image.src|escape_url }}" alt="{{ item.image.alt|escape_attr }}" loading="lazy" decoding="async"{% if item.image.width %} width="{{ item.image.width|escape_attr }}"{% endif %}{% if item.image.height %} height="{{ item.image.height|escape_attr }}"{% endif %}>{% elif is_in_editor %}<div class="hw-four-images__placeholder">Select image {{ loop.index }}</div>{% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% require_css %}<style>
.{{ name }}.baseModuleStyle {
  {{ module.style.spacing.desktop_spacing.css }}
  --four-images-gap:{{ module.style.column_gap }}px;
  {% if module.style.background_property.background_choice == 'bgImage' %}background-image:url('{{ module.style.background_property.background_image.src|escape_url }}');
  {% elif module.style.background_property.background_choice == 'gredient' %}background:{{ module.style.background_property.background_gredient.css }};
  {% else %}background-color:rgba({{ module.style.background_property.background_color.color|convert_rgb }},{{ module.style.background_property.background_color.opacity / 100 }});{% endif %}
}
@media(max-width:1300px){.{{ name }}.baseModuleStyle{ {{ module.style.spacing.tab_spacing.css }} }}
@media(max-width:767px){.{{ name }}.baseModuleStyle{ {{ module.style.spacing.mobile_spacing.css }} }}
</style>{% end_require_css %}

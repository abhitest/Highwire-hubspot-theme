<section class="{{ name|escape_attr }} baseModuleStyle hw-marketing-channels {{ module.custom_style.custom_class|escape_attr }}" {% if module.custom_style.section_id %}id="{{ module.custom_style.section_id|escape_attr }}"{% endif %} {% if module.content_group.title %}aria-labelledby="{{ name|escape_attr }}-title"{% endif %} data-marketing-module data-animate="{{ 'true' if module.style.enable_animation else 'false' }}">
<span class="baseModuleOverlay" aria-hidden="true"></span><div class="baseModuleParent hw-marketing-channels__layout">
{% if module.content_group.title %}<h2 id="{{ name|escape_attr }}-title" data-marketing-reveal>{{ module.content_group.title|escape_html }}</h2>{% endif %}
<div class="hw-marketing-channels__grid">{% for item in module.services %}
<article class="hw-marketing-channels__card" tabindex="0" {% if item.title %}aria-labelledby="{{ name|escape_attr }}-service-{{ loop.index }}"{% endif %}>
{% if item.title %}<h3 id="{{ name|escape_attr }}-service-{{ loop.index }}">{{ item.title|escape_html }}</h3>{% endif %}
{% if item.content %}<div class="hw-marketing-channels__description">{{ item.content }}</div>{% endif %}
</article>{% endfor %}</div>
</div></section>
{% require_css %}
<style>
.{{ name }}.hw-marketing-channels {
 {{ module.style.spacing.desktop_spacing.css }}
 {% if module.style.background_property.background_choice == 'bgImage' %}background-image:url('{{ module.style.background_property.background_image.src|escape_url }}');
 {% elif module.style.background_property.background_choice == 'gredient' %}background:{{ module.style.background_property.background_gredient.css }};
 {% else %}background-color:{{ module.style.background_property.background_color.css }};{% endif %}
 {% for color in ['heading_color','content_color','rule_color','accent_one','accent_two','accent_three'] %}--marketing-{{ color }}:{{ module.style[color].css }};{% endfor %}
}
{% if module.style.background_property.background_choice == 'bgImage' %}.{{ name }} > .baseModuleOverlay { background:{{ module.style.background_property.overlay_color.css }}; }{% endif %}

@media(max-width:1300px) { .{{ name }}.hw-marketing-channels { {{ module.style.spacing.tab_spacing.css }} }  }
@media(max-width:767px) { .{{ name }}.hw-marketing-channels { {{ module.style.spacing.mobile_spacing.css }} }  }
</style>
{% end_require_css %}

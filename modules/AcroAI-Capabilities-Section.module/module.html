<section class="hw-cap baseModuleStyle {{ name|escape_attr }} {{ module.custom_style.custom_class|escape_attr }}" {% if module.custom_style.section_id %}id="{{ module.custom_style.section_id|escape_attr }}"{% endif %} aria-labelledby="{{ name|escape_attr }}-title" data-animate="{{ module.content_group.animate|string|lower }}">
  <span class="baseModuleOverlay" aria-hidden="true"></span>
  <div class="baseModuleParent content-wrapper">
    <h2 class="hw-cap__title" id="{{ name|escape_attr }}-title">{{ module.content_group.title|escape_html }}</h2>
    <div class="hw-cap__layout">
      <figure class="hw-cap__media">
        <video class="hw-cap__video" muted loop playsinline preload="none" poster="{{ module.content_group.poster.src|escape_url }}" data-src="{{ module.content_group.video_url|escape_url }}" aria-label="{{ module.content_group.video_label|escape_attr }}"></video>
        <button class="hw-cap__pause" type="button" hidden aria-label="Pause video">Pause</button>
      </figure>
      <div class="hw-cap__list">
        {% for item in module.capabilities %}
        <article class="hw-cap__card" tabindex="0" aria-labelledby="{{ name|escape_attr }}-item-{{ loop.index }}">
          <div class="hw-cap__heading"><span class="hw-cap__icon" aria-hidden="true">{% if item.icon.src %}<img src="{{ item.icon.src|escape_url }}" alt="" width="24" height="24" loading="lazy">{% endif %}</span><h3 id="{{ name|escape_attr }}-item-{{ loop.index }}">{{ item.title|escape_html }}</h3><span class="hw-cap__number">{% if loop.index < 10 %}0{% endif %}{{ loop.index }}</span></div>
          <div class="hw-cap__description">{{ item.description }}</div>
        </article>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
{% require_css %}
<style>
.{{ name }}.baseModuleStyle {
  {{ module.style.spacing.desktop_spacing.css }} padding-left:0; padding-right:0;
  {% if module.style.background_property.background_choice == 'bgImage' %}background-image:url('{{ module.style.background_property.background_image.src|escape_url }}');
  {% elif module.style.background_property.background_choice == 'gredient' %}background:{{ module.style.background_property.background_gredient.css }};
  {% else %}background-color:rgba({{ module.style.background_property.background_color.color|convert_rgb }},{{ module.style.background_property.background_color.opacity / 100 }});{% endif %}
  --cap-title:{{ module.content_group.title_color.color }}; --cap-copy:{{ module.content_group.content_color.color }};
  --cap-gap:{{ module.style.column_gap }}px; --cap-heading-gap:{{ module.style.heading_gap }}px; --cap-sticky:{{ module.style.sticky_offset }}px;
  {% for key in ['accent_color','line_color','video_background'] %}--cap-{{ key }}:rgba({{ module.style[key].color|convert_rgb }},{{ module.style[key].opacity / 100 }});{% endfor %}
}
{% if module.style.background_property.background_choice == 'bgImage' %}.{{ name }} > .baseModuleOverlay { background:rgba({{ module.style.background_property.overlay_color.color|convert_rgb }},{{ module.style.background_property.overlay_color.opacity / 100 }}); }{% endif %}
@media(max-width:1300px) { .{{ name }}.baseModuleStyle { {{ module.style.spacing.tab_spacing.css }} padding-left:0; padding-right:0; } }
@media(max-width:767px) { .{{ name }}.baseModuleStyle { {{ module.style.spacing.mobile_spacing.css }} padding-left:0; padding-right:0; } }
</style>
{% end_require_css %}

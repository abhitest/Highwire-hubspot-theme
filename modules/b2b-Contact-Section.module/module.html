<section class="hw-contact {{ name|escape_attr }} {{ module.custom_style.custom_class|escape_attr }}" {% if module.custom_style.section_id %}id="{{ module.custom_style.section_id|escape_attr }}"{% endif %} aria-labelledby="{{ name|escape_attr }}-title" data-animate="{{ module.animate|escape_attr }}">
  <span class="hw-contact__rule" aria-hidden="true"></span>
  <div class="content-wrapper">
  <div class="hw-contact__layout">
    <div class="hw-contact__copy">
      <div class="hw-contact__intro">
        <h3 id="{{ name|escape_attr }}-title" data-contact-reveal>{{ module.heading }}</h3>
        <p data-contact-reveal>{{ module.intro }}</p>
      </div>
      <article class="hw-contact__leader">
        <div class="hw-contact__identity">
          {% if module.leader.photo.src %}
          <div class="hw-contact__photo" data-contact-reveal="photo"><img src="{{ module.leader.photo.src|escape_url }}" alt="{{ module.leader.photo.alt|escape_attr }}" width="100" height="124" loading="lazy"></div>
          {% endif %}
          <div data-contact-reveal><h3>{{ module.leader.full_name }}</h3><p>{{ module.leader.role }}</p></div>
        </div>
        <div class="hw-contact__bio font20 lh15" data-contact-reveal>{{ module.leader.bio }}</div>
      </article>
    </div>
      {% if module.form.form_id %}
    <div class="hw-contact__panel" id="hwcontactform"  data-contact-reveal>     
    </div>
    {% endif %}
  </div>
  </div>
</section>

{% require_css %}
<style>
.{{ name }}.hw-contact {
  --contact-background:rgba({{ module.style.background_color.color|convert_rgb }},{{ module.style.background_color.opacity / 100 }});
  {% for breakpoint in ['desktop','tablet','mobile'] %}
    {% for edge in ['top','bottom'] %}
      {% set spacing = module.style.spacing[breakpoint].padding[edge] %}
      --contact-{{ breakpoint }}-{{ edge }}:{{ spacing.value }}{{ spacing.units }};
    {% endfor %}
  {% endfor %}
}
</style>
{% end_require_css %}



{% require_js %}
  <script>
(function() {
  var formLoaded = false;
  
  function loadForm() {
    if (formLoaded) return;
    formLoaded = true;

    // Load reCAPTCHA + HubSpot form ONLY when user scrolls near it
    var script = document.createElement('script');
    script.src = '//js.hsforms.net/forms/embed/v2.js';
    script.charset = 'utf-8';
    script.type = 'text/javascript';
    script.onload = function() {
      hbspt.forms.create({
        portalId: "8855469",   // ← replace with your portal ID
        formId: `{{ module.form.form_id }}`,       // ← replace with your form ID
        target: "#hwcontactform"
      });
    };
    document.body.appendChild(script);
  }

  // Trigger when user scrolls within 300px of the form
  var observer = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting) {
      loadForm();
      observer.disconnect();
    }
  }, { rootMargin: "300px" });

  var wrapper = document.getElementById('hwcontactform');
  if (wrapper) observer.observe(wrapper);

  // Fallback: also load on first user interaction
  ['mousedown','touchstart','keydown'].forEach(function(evt) {
    document.addEventListener(evt, loadForm, { once: true });
  });
})();
</script>
{% end_require_js %}

{# Short entrance only: CSS finishes even if scripts fail or images load slowly. #}
<style>
  .hw-page-loader {
    position:fixed;
    inset:0;
    z-index:1000;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:var(--color-primary,#000);
    color:var(--color-secondary,#fff);
    --loader-ease:cubic-bezier(.22,1,.36,1);
    animation:hw-loader-finish 1.4s var(--loader-ease) both;
  }
  .hw-page-loader__logo {
    position:relative;
    z-index:3;
    width:clamp(180px,24vw,280px);
    overflow:hidden;
    padding-block:8px;
  }
  .hw-page-loader__logo svg { display:block; width:100%; height:auto; animation:hw-loader-logo .6s var(--loader-ease) .1s both; }
  .hw-page-loader__blocks {
    position:absolute;
    top:calc(50% + clamp(180px,24vw,280px) * .1143 + 28px);
    left:50%;
    width:clamp(180px,24vw,280px);
    height:3px;
    overflow:hidden;
    transform:translateX(-50%);
    background:rgba(255,255,255,.12);
  }
  .hw-page-loader__block {
    position:absolute;
    inset:0;
    transform:translateX(-101%);
    animation:hw-loader-sweep .65s var(--loader-ease) both;
  }
  .hw-page-loader__block--orange { background:var(--color-tertiary,#ff7042); animation-delay:.12s; }
  .hw-page-loader__block--pink { background:var(--color-quaternary,#fa9bff); animation-delay:.28s; }
  .hw-page-loader__block--blue { background:var(--color-quinary,#4bb7ff); animation-delay:.44s; }
  @keyframes hw-loader-logo {
    from { opacity:0; transform:translateY(115%); }
    to { opacity:1; transform:none; }
  }
  @keyframes hw-loader-sweep {
    from { transform:translateX(-101%); }
    to { transform:translateX(0); }
  }
  @keyframes hw-loader-finish {
    0%,76% { clip-path:inset(0); visibility:visible; }
    100% { clip-path:inset(0 0 100%); visibility:hidden; }
  }
  @media (width < 767px) {
    .hw-page-loader { display:none; animation:none; }
  }
  @media (prefers-reduced-motion:reduce) {
    .hw-page-loader { display:none; animation:none; }
    .hw-page-loader * { animation:none; }
  }
  html[data-motion="reduced"] .hw-page-loader { display:none; }
</style>

<script>
(() => {
  const loader = document.currentScript.previousElementSibling;
  if (!loader || !loader.classList.contains('hw-page-loader')) return;
  if (matchMedia('(width < 767px)').matches) {
    loader.remove();
    return;
  }
  let timeout;
  const dismiss = () => {
    loader.remove();
    clearTimeout(timeout);
    loader.removeEventListener('animationend', onEnd);
    document.removeEventListener('focusin', dismiss);
    window.removeEventListener('load', dismiss);
    window.removeEventListener('pagehide', dismiss);
  };
  const onEnd = event => {
    if (event.target === loader && event.animationName === 'hw-loader-finish') dismiss();
  };
  loader.addEventListener('animationend', onEnd);
  document.addEventListener('focusin', dismiss);
  window.addEventListener('load', dismiss, { once: true });
  // A restored page must never bring back an unfinished loader.
  window.addEventListener('pagehide', dismiss, { once: true });
  timeout = setTimeout(dismiss, 1400);
  if (document.readyState === 'complete' || document.querySelector('.body-wrapper:focus-within') ||
      matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'reduced') dismiss();
})();
</script>
